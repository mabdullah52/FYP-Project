# Builds the whole system into one Docker image and the LungCare Android app.
#
#   image    -> ghcr.io/mabdullah52/lungscan-ai:latest  (doctor app at /doctor/, patient app at /patient/)
#               run it on Azure Container Apps (or any Docker host) on port 7860
#   android  -> LungCare.apk under Releases; set the repository VARIABLE  LUNGCARE_SERVER
#               (e.g. https://lungscan-ai.xxxx.azurecontainerapps.io/patient) so the app knows the online address
#
# Runs on every push to main, or by hand: Actions tab -> "Build online image + Android app" -> Run workflow.
name: Build online image + Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build the Flutter doctor web app
        working-directory: doctor_flutter
        run: |
          flutter pub get
          flutter build web --release --base-href /doctor/
      - name: Assemble the server folder
        run: bash deploy/huggingface/assemble.sh server
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ghcr.io/mabdullah52/lungscan-ai:latest
      - name: Summary
        run: |
          echo "### Online image ready" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`ghcr.io/mabdullah52/lungscan-ai:latest\` (port 7860)" >> $GITHUB_STEP_SUMMARY
          echo "Azure Container Apps pulls this image. After an update: Azure portal > your container app > Revisions > Create new revision." >> $GITHUB_STEP_SUMMARY

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build the LungCare patient APK
        working-directory: lungcare_mobile
        env:
          SERVER: ${{ vars.LUNGCARE_SERVER }}
        run: |
          sed -i 's/-Xmx8G/-Xmx4G/' android/gradle.properties
          flutter pub get
          if [ -n "$SERVER" ]; then
            flutter build apk --release --dart-define=LUNGCARE_SERVER=$SERVER
          else
            flutter build apk --release
          fi
          cp build/app/outputs/flutter-apk/app-release.apk ../LungCare.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LungCare-android
          path: LungCare.apk
      - name: Publish the APK as a download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lungcare-latest
          name: LungCare Android app (latest)
          body: "Patient app. Server address built in: ${{ vars.LUNGCARE_SERVER || 'none yet - type it on the login screen' }}. Download LungCare.apk on the phone, open it and allow installing."
          files: LungCare.apk
          make_latest: true
